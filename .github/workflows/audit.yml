# Auditoría de dependencias (L12). Falla si npm conoce una vulnerabilidad alta o crítica en las
# dependencias de producción, las que llegan al sitio. Las de desarrollo no entran: arrastran avisos sin
# arreglo publicado y las actualiza Dependabot (decisión del fundador, 2026-11-17).
# Fuera de la puerta de cierre: depende de la red y de avisos ajenos al cambio.
name: Auditoría de dependencias

on:
  # Lunes a las 07:23 UTC.
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
