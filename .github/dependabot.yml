# Dependabot (L12): abre pull requests que pasan la CI; el fundador decide cada uno.
# Las menores y de parche de npm llegan juntas; las mayores, sueltas, para revisarlas una a una.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
